<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Request a demonstration password reset for your Coder's Cup account." /><title>Coder's Cup | Password Help</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" /><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" /><link rel="stylesheet" href="css/auth.css" />
  </head>
  <body>
    <header class="site-header"><div class="container nav-wrap"><a href="index.html" class="brand" aria-label="Coder's Cup home"><img class="brand-logo" src="cafeelogo.png" alt="Coder's Cup Cafe Logo" /><span class="brand-text"><strong>Coder's Cup</strong><small>Premium Cafe</small></span></a><button class="nav-toggle" aria-label="Toggle navigation" aria-expanded="false"><span></span><span></span><span></span></button><nav class="main-nav" aria-label="Main navigation"><ul class="nav-links"><li><a href="index.html">Home</a></li><li><a href="menu.html">Menu</a></li></ul></nav><div class="nav-actions"><a href="login.html" class="btn btn-primary">Login</a></div></div></header>
    <main class="auth-main"><section class="auth-card auth-card-compact"><div class="auth-intro"><img class="auth-logo" src="cafeelogo.png" alt="Coder's Cup Cafe Logo" /><p class="eyebrow accent">Account assistance</p><h1>Forgot Password?</h1><p>Enter your account email to view the reset demonstration.</p></div>
      <form id="forgot-form" class="auth-form" novalidate><div class="input-group"><label for="forgot-email">Email Address</label><input id="forgot-email" type="email" autocomplete="email" placeholder="you@example.com" /><small class="error-message" data-error-for="forgot-email"></small></div><p id="auth-feedback" class="form-feedback" role="status" aria-live="polite"></p><button type="submit" class="btn btn-primary btn-full">Continue</button></form>
      <p class="auth-switch"><a href="login.html">← Back to Login</a></p><p class="security-note">This demonstration does not send an email or change your password.</p>
    </section></main>
    <footer class="site-footer"><div class="footer-bottom"><div class="container footer-bottom-inner"><p>© <span id="year"></span> Coder's Cup. All rights reserved.</p><a href="index.html">Back to Home</a></div></div></footer>
    <script src="script.js"></script><script src="js/auth.js"></script>
  </body>
</html>
